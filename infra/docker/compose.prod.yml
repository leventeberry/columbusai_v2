# Production stack — single VPS, Traefik TLS, Columbus AI v2 apps.
# From repo root:
#   docker compose --env-file .env.production -f infra/docker/compose.prod.yml up -d --build
#
# Required in .env.production: DOMAIN, ACME_EMAIL, POSTGRES_PASSWORD, OPENAI_API_KEY,
#   CORS_ORIGIN, VITE_API_URL, SESSION_SECRET, WIDGET_SESSION_SECRET, REDIS_URL,
#   N8N_BASIC_AUTH_USER, N8N_BASIC_AUTH_PASSWORD, ADMIN_API_TOKEN (for n8n automation).
# Compose overrides: DATABASE_URL, internal n8n webhooks, NODE_ENV, API_URL for portal/admin.

services:
  traefik:
    image: traefik:v3.6.6
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@columbusai.tech}
    entrypoint: ["/bin/sh", "/etc/traefik/entrypoint.sh"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - ../traefik/traefik.yml.tpl:/etc/traefik/traefik.yml.tpl:ro
      - ../traefik/entrypoint.sh:/etc/traefik/entrypoint.sh:ro
      - columbus_prod_traefik_acme:/acme
    networks:
      - columbus-prod
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - columbus_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - columbus-prod
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: columbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: columbus
    volumes:
      - columbus_prod_pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U columbus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - columbus-prod
    restart: unless-stopped

  ensure-databases:
    image: pgvector/pgvector:pg16
    entrypoint: ["/bin/sh", "/scripts/ensure-databases.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_USER: columbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./ensure-databases.sh:/scripts/ensure-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - columbus-prod
    restart: "no"

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.migrate
    environment:
      DATABASE_URL: postgresql://columbus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/columbus
    depends_on:
      ensure-databases:
        condition: service_completed_successfully
    networks:
      - columbus-prod
    restart: "no"

  n8n:
    image: n8nio/n8n:2.23.2
    environment:
      N8N_HOST: n8n.${DOMAIN:-columbusai.tech}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN:-columbusai.tech}/
      N8N_SECURE_COOKIE: "true"
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:?N8N_BASIC_AUTH_USER is required}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD is required}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/New_York}
      COLUMBUS_API_URL: http://api:4000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?ADMIN_API_TOKEN is required for n8n automation}
      FOLLOWUP_WAIT_1_MINUTES: ${FOLLOWUP_WAIT_1_MINUTES:-1440}
      FOLLOWUP_WAIT_2_MINUTES: ${FOLLOWUP_WAIT_2_MINUTES:-2880}
      BOOKING_LINK: ${BOOKING_LINK:-https://cal.com/columbus-ai/30min}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_EXPRESSIONS_ALLOWED_ENV_VARS: ${N8N_EXPRESSIONS_ALLOWED_ENV_VARS:-}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: columbus
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - n8n_prod_data:/home/node/.n8n
    depends_on:
      ensure-databases:
        condition: service_completed_successfully
    networks:
      - columbus-prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN:-columbusai.tech}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    env_file:
      - ../../.env.production
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://columbus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/columbus
      VECTOR_DATABASE_URL: postgresql://columbus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/columbus_vectors
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN:-https://columbusai.tech,https://www.columbusai.tech,https://admin.columbusai.tech,https://portal.columbusai.tech}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set in production}
      WIDGET_SESSION_SECRET: ${WIDGET_SESSION_SECRET:?WIDGET_SESSION_SECRET is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      N8N_DEMO_WEBHOOK_URL: http://n8n:5678/webhook/f7ceff32-3922-4ac8-a522-2b83995e5f04
      FOLLOWUP_WAIT_1_MINUTES: ${FOLLOWUP_WAIT_1_MINUTES:-1440}
      FOLLOWUP_WAIT_2_MINUTES: ${FOLLOWUP_WAIT_2_MINUTES:-2880}
      BOOKING_LINK: ${BOOKING_LINK:-https://cal.com/columbus-ai/30min}
    depends_on:
      ensure-databases:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      n8n:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - columbus-prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${DOMAIN:-columbusai.tech}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=4000"

  marketing:
    build:
      context: ../..
      dockerfile: apps/marketing/Dockerfile
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.columbusai.tech}
        VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-contact@columbusai.tech}
        VITE_BOOKING_LINK: ${BOOKING_LINK:-https://cal.com/columbus-ai/30min}
        VITE_CHAT_TITLE: ${VITE_CHAT_TITLE:-Chexi AI}
        VITE_CHAT_WELCOME: ${VITE_CHAT_WELCOME:-I'm Chexi, your Columbus AI assistant. Ask me anything!}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-https://admin.${DOMAIN:-columbusai.tech}}
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - columbus-prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.marketing.rule=Host(`${DOMAIN:-columbusai.tech}`)"
      - "traefik.http.routers.marketing.entrypoints=websecure"
      - "traefik.http.routers.marketing.tls=true"
      - "traefik.http.routers.marketing.tls.certresolver=letsencrypt"
      - "traefik.http.services.marketing.loadbalancer.server.port=3000"
      - "traefik.http.routers.marketing-www.rule=Host(`www.${DOMAIN:-columbusai.tech}`)"
      - "traefik.http.routers.marketing-www.entrypoints=websecure"
      - "traefik.http.routers.marketing-www.tls=true"
      - "traefik.http.routers.marketing-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.marketing-www.middlewares=marketing-www-to-apex"
      - "traefik.http.routers.marketing-www.service=marketing"
      - "traefik.http.middlewares.marketing-www-to-apex.redirectregex.regex=^https://www\\.${DOMAIN:-columbusai.tech}/(.*)"
      - "traefik.http.middlewares.marketing-www-to-apex.redirectregex.replacement=https://${DOMAIN:-columbusai.tech}/$${1}"
      - "traefik.http.middlewares.marketing-www-to-apex.redirectregex.permanent=true"

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      target: runtime
    env_file:
      - ../../.env.production
    environment:
      NODE_ENV: production
      PORT: "3002"
      SALES_API_URL: http://api:4000
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - columbus-prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.${DOMAIN:-columbusai.tech}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=3002"

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
      target: runtime
    env_file:
      - ../../.env.production
    environment:
      NODE_ENV: production
      PORT: "3001"
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks:
      - columbus-prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portal.rule=Host(`portal.${DOMAIN:-columbusai.tech}`)"
      - "traefik.http.routers.portal.entrypoints=websecure"
      - "traefik.http.routers.portal.tls=true"
      - "traefik.http.routers.portal.tls.certresolver=letsencrypt"
      - "traefik.http.services.portal.loadbalancer.server.port=3001"

  # Legacy Next.js — optional during cutover (app.DOMAIN)
  web:
    profiles:
      - legacy
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    env_file:
      - ../../.env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://columbus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/columbus
      VECTOR_DATABASE_URL: postgresql://columbus:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/columbus_vectors
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.columbusai.tech}
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - columbus-prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-legacy.rule=Host(`app.${DOMAIN:-columbusai.tech}`)"
      - "traefik.http.routers.web-legacy.entrypoints=websecure"
      - "traefik.http.routers.web-legacy.tls=true"
      - "traefik.http.routers.web-legacy.tls.certresolver=letsencrypt"
      - "traefik.http.services.web-legacy.loadbalancer.server.port=3000"

networks:
  columbus-prod:
    name: columbus-prod

volumes:
  columbus_prod_pgdata:
  columbus_prod_redis_data:
  columbus_prod_traefik_acme:
  n8n_prod_data:
