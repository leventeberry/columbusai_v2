# Phase 1 dev compose — api + marketing + portal + admin + Postgres + Redis.
# Single postgres (pgvector): columbus (platform), columbus_vectors (RAG), n8n (automation).
services:
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/New_York}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: columbus
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-columbus}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      ensure-databases:
        condition: service_completed_successfully
    networks:
      - columbus-dev

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - columbus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - columbus-dev

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: columbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-columbus}
      POSTGRES_DB: columbus
    volumes:
      - columbus_pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U columbus"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - columbus-dev

  ensure-databases:
    image: pgvector/pgvector:pg16
    entrypoint: ["/bin/sh", "/scripts/ensure-databases.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_USER: columbus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-columbus}
    volumes:
      - ./ensure-databases.sh:/scripts/ensure-databases.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - columbus-dev
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ../../.env
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgresql://columbus:${POSTGRES_PASSWORD:-columbus}@postgres:5432/columbus
      VECTOR_DATABASE_URL: postgresql://columbus:${POSTGRES_PASSWORD:-columbus}@postgres:5432/columbus_vectors
      REDIS_URL: redis://redis:6379
      # Active workflows use /webhook/ (webhook-test only works during "Listen for test event" in UI)
      N8N_DEMO_WEBHOOK_TEST_URL: http://n8n:5678/webhook/f7ceff32-3922-4ac8-a522-2b83995e5f04
      N8N_DEMO_WEBHOOK_URL: http://n8n:5678/webhook/f7ceff32-3922-4ac8-a522-2b83995e5f04
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002,http://localhost:3010,http://127.0.0.1:3010
    depends_on:
      ensure-databases:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - columbus-dev

  marketing:
    build:
      context: ../..
      dockerfile: apps/marketing/Dockerfile
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - ../../.env
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://columbus:${POSTGRES_PASSWORD:-columbus}@postgres:5432/columbus
      VITE_API_URL: http://localhost:4000
      VITE_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-contact@columbusai.tech}
      VITE_CHAT_TITLE: ${NEXT_PUBLIC_CHAT_TITLE:-Chexi AI}
      VITE_CHAT_WELCOME: ${NEXT_PUBLIC_CHAT_WELCOME:-I'm Chexi, your Columbus AI assistant. Ask me anything!}
      VITE_BOOKING_LINK: ${BOOKING_LINK:-https://cal.com/columbus-ai/30min}
    depends_on:
      ensure-databases:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    networks:
      - columbus-dev

  portal:
    build:
      context: ../..
      dockerfile: apps/portal/Dockerfile
      target: dev
    ports:
      - "3001:3001"
    env_file:
      - ../../.env
    environment:
      PORT: "3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - columbus-dev

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      target: dev
    ports:
      - "3002:3002"
    env_file:
      - ../../.env
    environment:
      PORT: "3002"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - columbus-dev

  # Legacy Next.js marketing (reference only)
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      target: dev
    ports:
      - "3010:3000"
    env_file:
      - ../../.env
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://columbus:${POSTGRES_PASSWORD:-columbus}@postgres:5432/columbus
      VECTOR_DATABASE_URL: postgresql://columbus:${POSTGRES_PASSWORD:-columbus}@postgres:5432/columbus_vectors
      REDIS_URL: redis://redis:6379
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      ensure-databases:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    profiles:
      - legacy
    networks:
      - columbus-dev

networks:
  columbus-dev:
    name: columbus-dev

volumes:
  columbus_pgdata:
  columbus_redis_data:
  n8n_data:
